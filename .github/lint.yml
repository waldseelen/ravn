name: Lint\n\non:\n  push:\n    branches: [ main, develop ]\n  pull_request:\n    branches: [ main, develop ]\n\njobs:\n  lint:\n    runs-on: ubuntu-latest\n    \n    steps:\n    - uses: actions/checkout@v3\n    \n    - name: Set up Python\n      uses: actions/setup-python@v4\n      with:\n        python-version: '3.11'\n    \n    - name: Install linting tools\n      run: |\n        python -m pip install --upgrade pip\n        pip install flake8 pylint black isort\n    \n    - name: Check formatting with black\n      run: black --check ravn_app tests\n      continue-on-error: true\n    \n    - name: Check imports with isort\n      run: isort --check-only ravn_app tests\n      continue-on-error: true\n    \n    - name: Lint with flake8\n      run: |\n        flake8 ravn_app tests --count --select=E9,F63,F7,F82 --show-source --statistics\n        flake8 ravn_app tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics\n      continue-on-error: true\n"