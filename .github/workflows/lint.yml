name: lint

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      # ruff is the enforced gate: the codebase is clean, so any new violation fails CI.
      - name: Ruff (blocking)
        run: ruff check ravn_app tests

      # mypy is BLOCKING on the core business logic + utils (0 errors). UI mixin typing is
      # still being tightened (see ROADMAP workstream 2), so ravn_app/ui is not gated yet.
      - name: Mypy core + utils (blocking)
        run: mypy ravn_app/core ravn_app/utils
