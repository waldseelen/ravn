name: tests

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      # Coverage floor guards against regressions. Baseline is ~51%; raise the
      # threshold as ROADMAP workstream 3 adds tests. Much of the gap is UI code
      # that is exercised via construction smoke tests rather than line coverage.
      - name: Run tests
        run: pytest -q --cov=ravn_app --cov-report=term-missing --cov-fail-under=49

