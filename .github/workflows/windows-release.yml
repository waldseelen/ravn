name: windows-release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Build release package
        shell: pwsh
        env:
          SIGN_CERT_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          SIGN_CERT_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          ./build.ps1 -Action ci-package -DownloadBundledFFmpeg

      - name: Install WiX Toolset
        shell: pwsh
        run: dotnet tool install --global wix

      - name: Build MSI package
        shell: pwsh
        run: |
          ./build.ps1 -Action ci-msi

      - name: Generate SBOM
        shell: pwsh
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements -o dist/RAVN-windows-x64.sbom.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RAVN-windows-x64.zip
            dist/RAVN-windows-x64.msi
            dist/RAVN-windows-x64.sha256.txt
            dist/RAVN-windows-x64.sbom.json
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
